[package]
name = "rdkit"
kind = "tool"
version = "2026.09.2"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/rdkit"

[command]
name = "taf-rdkit"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/rdkit:2026.09.2-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["cheminformatics", "molecular-informatics", "molecular-descriptors", "machine-learning"]
keywords = ["RDKit", "SMILES", "SDF", "molecular fingerprints", "molecular descriptors", "substructure search", "cheminformatics", "molecule drawing"]
description = "RDKit 2026.09.2 Python cheminformatics runtime with native amd64/arm64 builds, core shared libraries, runtime data, upstream Contrib files, and scientific Python dependencies."

[upstream]
name = "RDKit"
type = "github"
repo = "rdkit/rdkit"
homepage = "https://www.rdkit.org/"
release_url = "https://github.com/rdkit/rdkit/releases/tag/Release_2026_09_2"
downloads = "https://github.com/rdkit/rdkit/archive/refs/tags/Release_2026_09_2.tar.gz"
version = "2026.09.2"
license = "BSD-3-Clause"
description = "Open-source cheminformatics and machine-learning toolkit written in C++ and Python."
citation = "RDKit: Open-source cheminformatics. https://www.rdkit.org"
doi = "10.5281/zenodo.591637"
watch = "tags"
strip_prefix = "Release_"

[smoke]
backend = "docker"
timeout = 180
exist = ["python", "python3", "rdkit-runtime-info"]
test = ["set -eu; info=$(rdkit-runtime-info --json); printf '%s\\n' \"$info\" | grep -F '\"rdkit\": \"2026.09.2\"' >/dev/null; printf '%s\\n' \"$info\" | grep -F '\"np-score\": \"available\"' >/dev/null; version=$(python -c 'import rdkit; from rdkit import Avalon, Chem, DataManip, Dbase, DistanceGeometry, ForceField, Geometry, ML, Numerics, SimDivFilters, VLib; from rdkit.Chem import AllChem, Draw, PandasTools, inchi, rdCoordGen, rdFreeSASA, rdMolDescriptors, rdSynthonSpaceSearch; assert rdkit.__version__ == \"2026.09.2\"; print(rdkit.__version__)'); test \"$version\" = '2026.09.2'","python --help 2>&1 | grep -F 'usage: python' >/dev/null && python -m rdkit.Chem.ChemUtils.SDFToCSV --help 2>&1 | grep -F 'Convert SDF file to CSV' >/dev/null && rdkit-runtime-info --help 2>&1 | grep -F 'runtime versions' >/dev/null","set -eu; tmp=$(mktemp -d /tmp/taf-rdkit-smoke.XXXXXX); trap 'rm -rf \"$tmp\"' EXIT HUP INT TERM; python /opt/rdkit/share/testdata/rdkit-smoke.py \"$tmp/results\"; test -s \"$tmp/results/molecules.sdf\"; test -s \"$tmp/results/molecule.svg\"; test -s \"$tmp/results/molecule.png\"; test -s \"$tmp/results/molecule.pdf\"; test -s \"$tmp/results/tiny-space.spc\"; grep -F 'rdkit_version' \"$tmp/results/summary.tsv\" | grep -F '2026.09.2' >/dev/null; python -m rdkit.Chem.ChemUtils.SDFToCSV \"$tmp/results/molecules.sdf\" \"$tmp/results/molecules.csv\"; test -s \"$tmp/results/molecules.csv\"; grep -F 'SMILES' \"$tmp/results/molecules.csv\" >/dev/null; grep -F 'aspirin' \"$tmp/results/molecules.csv\" >/dev/null"]
